<title>Tracker</title>
<!-- La police : Noto Sans JP, une police gothique (sans empattements), le style le plus courant au Japon -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap">

<style>
/* ===== COULEURS =====
   Pour changer l'ambiance, modifie ces valeurs.
   --l4 : couleur des cases pleines / --l0 : cases vides / --bg : fond de la page */
:root{
  --bg:#0e0f11; --text:#d9dade; --dim:#7a7d85;
  --edge:#25282f; --l0:#15171b; --l4:#f1efe9; --focus:#f1efe9; --panel:#15171b;
  --glass:var(--panel); --glass-edge:var(--edge); --glass-hi:none; --glass-on:var(--panel); --glass-chip:var(--l0);
  --sheet:var(--bg); --barbg:color-mix(in srgb,var(--bg) 88%,transparent);   /* surfaces « verre » : le thème Glace les rend vraiment translucides */
  --cell:14px; --gap:3px;   /* taille des cases et espace entre elles : modifiés par le zoom (Paramètres) */
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
/* Si le téléphone est en mode clair, on utilise ces couleurs à la place */
@media (prefers-color-scheme: light){
  :root:not([data-theme]){
    --bg:#f5f3ee; --text:#1f1f22; --dim:#85878d;
    --edge:#dedbd3; --l0:#e9e6df; --l4:#17181a; --focus:#17181a; --panel:#ebe8e1;
  }
}
:root[data-theme="dark"]{ color-scheme:dark; }
/* Thèmes choisis dans les Paramètres (« Auto » = aucun attribut : la page suit le mode clair/sombre du téléphone) */
:root[data-theme="nuit"]{ color-scheme:dark; --bg:#0e0f11; --text:#d9dade; --dim:#7a7d85; --edge:#25282f; --l0:#15171b; --l4:#f1efe9; --focus:#f1efe9; --panel:#15171b; }
:root[data-theme="papier"]{ --bg:#f5f3ee; --text:#1f1f22; --dim:#85878d; --edge:#dedbd3; --l0:#e9e6df; --l4:#17181a; --focus:#17181a; --panel:#ebe8e1; }
/* GLACE : fond dégradé doux et surfaces en verre dépoli (translucides, floues, bord clair) */
:root[data-theme="glace"]{
  color-scheme:dark;
  --bg:#1d1b1c; --text:#f3efea; --dim:rgba(243,239,234,.55);
  --edge:rgba(255,255,255,.13); --l0:rgba(255,255,255,.08); --l4:#f5f0e9; --focus:#f5f0e9; --panel:rgba(255,255,255,.08);
  --glass:rgba(255,255,255,.08); --glass-edge:rgba(255,255,255,.17); --glass-hi:inset 0 1px 0 rgba(255,255,255,.2);
  --glass-on:rgba(255,255,255,.2); --glass-chip:rgba(255,255,255,.11);
  --sheet:rgba(52,48,50,.72); --barbg:rgba(34,31,33,.5);
  --wp-tint:rgba(20,18,19,.3);
}
:root[data-theme="glace"] body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(120% 60% at 12% 0%,#6a625d 0%,rgba(106,98,93,0) 62%),radial-gradient(90% 60% at 100% 100%,#4a4350 0%,rgba(74,67,80,0) 62%),#1e1c1d}
/* GLACE CLAIR : même idée en version claire — fond perle avec un reflet lavande et pêche, verre blanc translucide */
:root[data-theme="glaceclair"]{
  color-scheme:light;
  --bg:#ebe7e3; --text:#1f1d1c; --dim:rgba(31,29,28,.52);
  --edge:rgba(31,29,28,.1); --l0:rgba(31,29,28,.06); --l4:#1f1d1c; --focus:#1f1d1c; --panel:rgba(255,255,255,.5);
  --glass:rgba(255,255,255,.5); --glass-edge:rgba(255,255,255,.85);
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.9), 0 10px 28px rgba(60,50,70,.08);
  --glass-on:rgba(255,255,255,.82); --glass-chip:rgba(255,255,255,.55);
  --sheet:rgba(250,248,246,.78); --barbg:rgba(244,241,238,.6);
  --wp-tint:rgba(255,255,255,.2);
}
:root[data-theme="glaceclair"] body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(110% 55% at 10% 0%,#ffffff 0%,rgba(255,255,255,0) 62%),radial-gradient(90% 60% at 100% 100%,#d8d0e6 0%,rgba(216,208,230,0) 65%),radial-gradient(70% 40% at 0% 100%,#efd9cf 0%,rgba(239,217,207,0) 70%),#e9e5e1}
/* Ton fond d'écran (Paramètres) : un vrai calque fixe derrière la page, avec un léger voile ; il remplace le dégradé des thèmes Glace */
#wp{display:none;position:fixed;inset:0;z-index:-1;background:center/cover no-repeat}
#wp::after{content:'';position:absolute;inset:0;background:var(--wp-tint,transparent)}
:root[data-theme^="glace"].haswp #wp{display:block}
:root[data-theme^="glace"].haswp body::before{display:none}
:root[data-theme="sepia"]{ --bg:#f0e4cc; --text:#3a2e21; --dim:#8c7b62; --edge:#dccfb2; --l0:#e6d8bc; --l4:#4a3524; --focus:#4a3524; --panel:#e9dcc2; }

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif; font-size:15px;
}
main{max-width:900px;margin:0 auto;padding:28px 18px 96px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--focus);outline-offset:2px}

/* ===== UNE HABITUDE ===== */
.habit{margin-bottom:14px;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border-radius:24px;padding:16px 14px 12px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.nm{text-align:left;min-width:0;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.sq{width:28px;height:28px;border:1px solid var(--glass-edge);border-radius:10px;background:var(--glass-chip);line-height:1;font-size:16px}
.sq.chk{width:24px;height:24px;border-color:var(--dim);transition:background .12s}
.sq.chk.on{background:var(--l4);border-color:var(--l4)}
.val{min-width:70px;text-align:center;font-size:14px}
/* Fenêtre de saisie d'une quantité */
.entry{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 4px}
.entry .sq{width:46px;height:46px;font-size:22px}
.big{min-width:140px;text-align:center;font-size:18px}
.btn.tg{min-width:170px;padding:14px;font-size:16px}
.btn.tg.on{background:var(--l4);color:var(--bg);border-color:var(--l4)}

/* ===== LA HEATMAP ===== */
.map{display:flex}
.days{display:grid;grid-template-rows:repeat(7,var(--cell));gap:var(--gap);margin-right:8px;color:var(--dim);font-size:clamp(7px,calc(var(--cell)*.72),11px);line-height:var(--cell)}
.scroll{flex:1;min-width:0;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.months{position:relative;height:16px;margin-bottom:3px;width:max-content;min-width:100%}
.months span{position:absolute;top:0;color:var(--dim);font-size:11px;white-space:nowrap}
/* padding-right : évite que la dernière colonne soit coupée au bord */
.grid{display:grid;grid-template-rows:repeat(7,var(--cell));grid-auto-flow:column;grid-auto-columns:var(--cell);gap:var(--gap);width:max-content;padding-right:6px}
/* Taille des cases : réglée par le zoom dans les Paramètres (variables --cell et --gap) */
.c{width:var(--cell);height:var(--cell);border-radius:calc(var(--cell)*.22);border:1px solid var(--edge);background:var(--l0)}
.c.on{border-color:transparent}
.c.future{visibility:hidden}
.c.today{box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--dim)}
.c.sel{box-shadow:0 0 0 1px var(--bg),0 0 0 2px var(--focus)}
.empty{color:var(--dim);text-align:center;margin-top:20vh;line-height:1.8}

/* ===== BARRE DU BAS ===== */
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;
  padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--barbg);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
  border-top:1px solid var(--edge);font-size:13px}
.bar button{color:var(--dim);padding:4px 2px}
.bar button:hover{color:var(--text)}
/* onglets des pages (en bas à gauche) et boutons de droite */
.tabs,.right{display:flex;gap:16px}
.tabs{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.right{flex:none;white-space:nowrap}
.right{margin-left:16px}
.bar button.on{color:var(--text)}
#new{font-size:20px;line-height:1;padding:0 4px}

/* ===== FENÊTRES (création, données) ===== */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#ov[hidden]{display:none}
.sheet{width:100%;max-width:460px;background:var(--sheet);backdrop-filter:blur(28px) saturate(1.3);-webkit-backdrop-filter:blur(28px) saturate(1.3);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);border-radius:26px 26px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}

/* pastilles de couleur (création d'une habitude) */

/* pastille « spectre » : ouvre le sélecteur de couleur du téléphone / de l'ordinateur */

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 8px}

.wk{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:22px;padding:16px 18px;margin-bottom:14px}

/* matrice d'Eisenhower : 4 cartes arrondies, fond légèrement différent de la page */
.mx{display:grid;grid-template-columns:1fr;gap:14px}   /* une seule colonne : les 4 blocs se suivent de haut en bas */
.qd{position:relative;background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--glass-hi);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border-radius:0;padding:14px 14px 12px;min-width:0;min-height:0;display:flex;flex-direction:column}

.qn{text-align:left;font-weight:500;font-size:15px;max-width:100%;overflow-wrap:anywhere}

.tk{display:flex;align-items:flex-start;gap:10px;padding:6px 0}

.tk.done .ck{background:var(--l4);border-color:var(--l4);opacity:.38}
.tk.done .ck::after{content:'';width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

.tadd::placeholder{color:var(--dim);font-size:12px}
.mxf{margin-top:18px;text-align:center}
/* sous-tâches : indentées sous la tâche, avec une flèche pour plier / déplier */
.fold{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--dim);font-size:11px;padding:3px 0 3px 8px;flex:none}

.sk.done .tt{text-decoration:line-through;opacity:.7}
/* édition des sous-tâches dans la fenêtre d'une tâche */
.srow{display:flex;align-items:center;gap:8px;margin-top:8px}
.srow input{flex:1}
.srow .btn{padding:8px 12px}

.ck.on{background:var(--l4);border-color:var(--l4)}
.ck.on::after{content:'';width:5px;height:9px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* champ d'ajout : une pilule en verre avec un bouton « + » plein à gauche */
.qd form{margin-top:4px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}

.tabs{gap:4px}

details{margin-top:18px;color:var(--dim);font-size:13px}
summary{cursor:pointer}

<body>
<main id="habits"></main>
<div class="bar"><nav class="tabs" id="tabs"></nav><div class="right"><button id="new" aria-label="Ajouter une habitude">+</button><button id="dat">Paramètres</button></div></div>
<div id="ov" hidden><div class="sheet" id="sheet"></div></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
/* ============================================================
   1. OUTILS DE BASE
   ============================================================ */
const KEY = 'tracker-v2';                    // nom sous lequel les données sont gardées dans le navigateur
const $ = s => document.querySelector(s);    // raccourci : $('#id') trouve un élément de la page

// Noms des mois en kanji et des jours de la semaine (lundi en premier)
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const WEEK   = ['月','火','水','木','金','土','日'];

// Transforme une date en texte "2026-10-14" (sert de clé pour retrouver un jour)
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
// Affiche un nombre avec une virgule (0,25) et sans décimales inutiles
const fmt = n => String(Math.round(n*100)/100).replace('.',',');
// Lit un nombre tapé par l'utilisateur ; si invalide, renvoie la valeur par défaut
const num = (s,def) => { const v = parseFloat(String(s).replace(',','.')); return v>0 ? v : def; };

/* ============================================================
   2. DONNÉES
   state = { habits: [ {id, name, goal, unit, step} ],
             log:    { idHabitude: { "2026-10-14": 1.5, ... } } }
   ============================================================ */
function seed(){ // Données de démonstration au premier lancement
  const habits = [
    {id:'h1', name:'水を飲む', goal:2,  unit:'L',     step:0.25},
    {id:'h2', name:'読書',     goal:10, unit:'pages', step:1},
    {id:'h3', name:'運動',     goal:1,  unit:'',      step:1}];
  const log = {}, t = new Date();
  habits.forEach(h => {
    log[h.id] = {};
    for(let i=1;i<260;i++){
      if(Math.random() < 0.1 + 0.6*(1-i/260)){
        const d = new Date(t); d.setDate(t.getDate()-i);
        const r = Math.random()<.45 ? 1 : Math.random();
        const v = Math.round(h.goal*r/h.step)*h.step;
        if(v>0) log[h.id][key(d)] = v;
      }
    }
  });
  return {habits, log};
}
// Vérifie qu'un objet a la bonne forme (utile pour l'import) et le nettoie
function clean(o){
  if(!o || !Array.isArray(o.habits) || typeof o.log!=='object') return null;
  o.habits = o.habits.filter(h => h && h.id && h.name).map(h => ({
    id:String(h.id), name:String(h.name), goal:num(h.goal,1), unit:String(h.unit||''), step:num(h.step,1),
    color:/^#[0-9a-f]{6}$/i.test(h.color) ? h.color : '',
    page:String(h.page||''), archived:!!h.archived}));    // page : identifiant de la page ('' = aucune)      // couleur : '' = couleur du thème
  o.notes = (o.notes && typeof o.notes==='object') ? o.notes : {};
  // Tâches de la matrice d'Eisenhower : q = quadrant (0 à 3), done = terminée ou non
  o.tasks = Array.isArray(o.tasks) ? o.tasks.filter(t => t && t.id && t.text).map(t => ({id:String(t.id), text:String(t.text), b:String(t.b || ('q'+([0,1,2,3].includes(t.q) ? t.q : 0))), done:!!t.done, fold:!!t.fold,
    subs:Array.isArray(t.subs) ? t.subs.filter(s => s && s.text).map((s,i) => ({id:String(s.id||('s'+i)), text:String(s.text), done:!!s.done})) : []})) : [];
  // Blocs de tâches (créés, renommés, supprimés par l'utilisateur). Anciennes données : les 4 quadrants utilisés deviennent des blocs.
  const QN = ['Urgent · Important','Pas urgent · Important','Urgent · Pas important','Pas urgent · Pas important'];
  o.blocks = Array.isArray(o.blocks)
    ? o.blocks.filter(b => b && b.id && b.name).map(b => ({id:String(b.id), name:String(b.name)}))
    : [0,1,2,3].filter(i => o.tasks.some(t => t.b==='q'+i)).map(i => ({id:'q'+i, name:QN[i]}));
  o.tasks = o.tasks.filter(t => o.blocks.some(b => b.id===t.b));
  // Pages créées par l'utilisateur. Anciennes données : on garde « Quotidien » / « Loisirs » seulement si des habitudes y étaient rangées.
  if(Array.isArray(o.pages)){
    o.pages = o.pages.filter(p => p && p.id && p.name).map(p => ({id:String(p.id), name:String(p.name)}));
  }else{
    o.pages = o.habits.some(h => h.page==='hobby') ? [{id:'daily',name:'Quotidien'},{id:'hobby',name:'Loisirs'}] : [];
    if(!o.pages.length) o.habits.forEach(h => h.page = '');
  }
  return o;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const o = clean(JSON.parse(r)); if(o) return o; } }catch(e){}
  return seed();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

let state = load();
state.notes = state.notes || {};   // notes : { idHabitude: { "2026-10-14": "texte" } }
state.tasks = state.tasks || [];   // tâches : [ {id, text, b (id du bloc), done} ]
state.blocks = state.blocks || []; // blocs de tâches : [ {id, name} ]
state.pages = state.pages || [];   // pages créées par l'utilisateur : [ {id, name} ] (aucune par défaut)

// Réglages d'affichage : gardés à part des données, donc propres à chaque appareil
// (le bon zoom du téléphone n'est pas celui du PC, et il n'est pas écrasé par un import)
const SKEY = 'tracker-settings';
let settings = {zoom:100, weeks:53, page:'', range:30, theme:'glace', glaceSeen:false, summary:false, sumSeen:'', compare:false, notesAsc:false};      // zoom en % ; weeks = 26 (6 mois) ou 53 (12 mois)
try{ Object.assign(settings, JSON.parse(localStorage.getItem(SKEY)||'{}')); }catch(e){}
if(typeof settings.page !== 'string') settings.page = '';
if(!['glace','glaceclair','auto','nuit','papier','sepia'].includes(settings.theme)) settings.theme = 'glace';
if(!settings.glaceSeen){ settings.theme = 'glace'; settings.glaceSeen = true; saveSettings(); }   // une seule fois : on passe au thème Glace ; tu peux en changer dans les Paramètres   // page affichée ; range = période des stats (en jours, 0 = tout)
function saveSettings(){ try{ localStorage.setItem(SKEY, JSON.stringify(settings)); }catch(e){} }
// À 100 %, une case fait 14 px et l'espace entre deux cases 3 px
const cellPx = () => +(14*settings.zoom/100).toFixed(1);
const gapPx  = () => +(3*settings.zoom/100).toFixed(1);
const weekWidth = () => cellPx() + gapPx();     // largeur d'une colonne (une semaine)
function applyZoom(){
  document.documentElement.style.setProperty('--cell', cellPx()+'px');
  document.documentElement.style.setProperty('--gap', gapPx()+'px');
}
const WKEY = 'tracker-wallpaper';   // l'image est gardée à part des réglages (elle est plus lourde)
let wallpaper = ''; try{ wallpaper = localStorage.getItem(WKEY) || ''; }catch(e){}
function applyWallpaper(){
  let w = document.getElementById('wp');
  if(!w){ w = document.createElement('div'); w.id = 'wp'; document.body.insertBefore(w, document.body.firstChild); }
  w.style.backgroundImage = wallpaper ? 'url("'+wallpaper+'")' : 'none';
  document.documentElement.classList.toggle('haswp', !!wallpaper);
}
// Garde la meilleure qualité que le stockage accepte : on essaie du plus grand/net au plus léger
// done(état) : 'ok' | 'nostore' (affichée mais pas gardée) | 'err'
function loadWallpaper(file, done){
  const fr = new FileReader();
  fr.onerror = () => done('err');
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => done('err');
    img.onload = () => {
      const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
      let stored = false;
      for(const [max, q] of [[2600,.92],[2000,.88],[1500,.82],[1000,.72]]){
        try{
          const k = Math.min(1, max/Math.max(W,H)), c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(W*k)); c.height = Math.max(1, Math.round(H*k));
          const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, c.width, c.height);
          wallpaper = c.toDataURL('image/jpeg', q);
        }catch(e){ continue; }
        try{ localStorage.setItem(WKEY, wallpaper); stored = true; break; }catch(e){}   // trop lourd pour le stockage : on réessaie en plus léger
      }
      if(!wallpaper) return done('err');
      applyWallpaper(); done(stored ? 'ok' : 'nostore');
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function applyTheme(){   // « auto » : aucun attribut, la page suit le mode clair/sombre du téléphone
  if(settings.theme!=='auto') document.documentElement.dataset.theme = settings.theme;
  else delete document.documentElement.dataset.theme;
}
applyZoom();
applyTheme();
applyWallpaper();

// Pages : créées dans les Paramètres. 'stats' est la page des statistiques. Sans aucune page, toutes les habitudes s'affichent ensemble.
// pageOf : la page où s'affiche une habitude (si sa page n'existe plus, elle passe sur la première)
const pageOf = h => state.pages.some(p => p.id===h.page) ? h.page : (state.pages[0] ? state.pages[0].id : '');
// curPage : la page actuellement ouverte (valide même après une suppression ou un import)
function curPage(){
  const p = settings.page;
  if(p==='matrix' || p==='archive') return p;   // (les pages 'stats' et 'notes' sont désactivées)
  return state.pages.some(x => x.id===p) ? p : (state.pages[0] ? state.pages[0].id : '');
}
function drawTabs(){   // construit les onglets, met en évidence l'actif, cache « + » sur la page Stats
  const t = $('#tabs'); t.innerHTML = '';
  const cur = curPage();
  const items = (state.pages.length ? state.pages : [{id:'', name:'Habitudes'}]).concat([{id:'matrix', name:'Tâches'}]);
  // Onglets Stats et Notes désactivés pour l'instant (code conservé en commentaire plus bas) :
  // items.push({id:'stats', name:'Stats'});
  // if(hasNotes()) items.push({id:'notes', name:'Notes'});                               // visible seulement s'il y a des notes
  if(state.habits.some(h => h.archived)) items.push({id:'archive', name:'Archive'});   // visible seulement s'il y a des habitudes en pause
  items.forEach(p => { const b = mk('button', p.id===cur ? 'on' : '', p.name); b.dataset.p = p.id; t.appendChild(b); });
  $('#new').style.visibility = ['matrix','archive'].includes(cur) ? 'hidden' : 'visible';
}
function setPage(p){ settings.page = p; saveSettings(); render(true); window.scrollTo(0,0); }

/* ============================================================
   MINUTEUR (habitudes en minutes) : les minutes s'ajoutent toutes seules
   Les minuteurs en cours sont gardés à part : ils continuent même si on ferme la page.
   ============================================================ */
const TKEY = 'tracker-timers';
let timers = {};   // { idHabitude: { start: heure de départ, day: jour de départ } }
try{ timers = JSON.parse(localStorage.getItem(TKEY)||'{}'); }catch(e){}
function saveTimers(){ try{ localStorage.setItem(TKEY, JSON.stringify(timers)); }catch(e){} }
const clock = ms => {   // 754000 → "12:34"
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : m)+':'+String(x).padStart(2,'0');
};
function startTimer(h){ timers[h.id] = {start:Date.now(), day:key(new Date())}; saveTimers(); render(); }
// Durée lisible : 754000 → "12 min 34 s" (ou "1 h 05 min" au-delà d'une heure)
const dur = ms => {
  const s = Math.round(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  return h ? h+' h '+String(m).padStart(2,'0')+' min' : m+' min '+String(s%60).padStart(2,'0')+' s';
};
function stopTimer(h){   // ajoute les minutes écoulées (arrondies) au jour de départ
  const t = timers[h.id]; if(!t) return null;
  const ms = Date.now()-t.start, m = Math.round(ms/60000);
  delete timers[h.id]; saveTimers();
  if(m>0) setVal(h, t.day, val(h,t.day)+m); else render();
  return {ms, m};   // durée exacte de la session et minutes ajoutées
}
// Mise à jour de l'affichage du temps, chaque seconde
setInterval(() => {
  document.querySelectorAll('.tm,.tms').forEach(e => {
    const t = timers[e.dataset.id]; if(!t) return;
    e.textContent = (e.classList.contains('tms') ? '■ Arrêter · ' : '● ')+clock(Date.now()-t.start);
  });
}, 1000);


// Valeur d'une habitude pour un jour donné (0 si rien)
const val = (h,k) => (state.log[h.id]||{})[k] || 0;
// Notes : une petite note facultative par habitude et par jour
const getNote = (h,k) => ((state.notes||{})[h.id]||{})[k] || '';
const hasNotes = () => Object.values(state.notes||{}).some(o => Object.keys(o).length>0);   // y a-t-il au moins une note ?
function setNote(h,k,t){
  state.notes = state.notes || {};
  const n = state.notes[h.id] = state.notes[h.id] || {};
  if(t.trim()) n[k] = t; else delete n[k];
  save();
}
// Enregistre une valeur et redessine
function setVal(h,k,v){
  v = Math.max(0, Math.round(v*100)/100);
  const l = state.log[h.id] = state.log[h.id] || {};
  if(v>0) l[k] = v; else delete l[k];
  save(); render();
}

/* ============================================================
   3. DESSIN D'UNE HABITUDE (titre + boutons + heatmap)
   ============================================================ */
function block(h, showMonths, today, start){
  const tk = key(today);   // tk = date d'aujourd'hui
  const el = document.createElement('section'); el.className = 'habit';
  el.innerHTML =
    '<div class="hd"><button class="nm"></button></div>'+
    '<div class="map"><div class="days"></div><div class="scroll">'+(showMonths?'<div class="months"></div>':'')+'<div class="grid"></div></div></div>';

  // Titre : toucher le nom ouvre la fenêtre de modification
  const nm = el.querySelector('.nm'); nm.textContent = h.name; nm.onclick = () => openHabit(h);
  // Si un minuteur tourne pour cette habitude, on affiche le temps écoulé (toucher ouvre la fenêtre pour l'arrêter)
  if(timers[h.id]){
    const tm = mk('button','tm','● '+clock(Date.now()-timers[h.id].start)); tm.dataset.id = h.id;
    tm.onclick = () => openEntry(h, key(today));
    el.querySelector('.hd').appendChild(tm);
  }


  // Jours de la semaine à gauche (le décalage aligne avec la grille quand les mois sont affichés)
  const days = el.querySelector('.days');
  days.innerHTML = WEEK.map(d => '<span>'+d+'</span>').join('');
  if(showMonths) days.style.marginTop = '19px';

  // La grille : 53 semaines × 7 jours
  const g = el.querySelector('.grid'), mo = el.querySelector('.months');
  let lastMonth = -1;
  for(let w=0; w<settings.weeks; w++){
    const first = new Date(start); first.setDate(start.getDate()+w*7);
    if(mo && first.getMonth()!==lastMonth){            // nouveau mois → on écrit son nom en kanji
      lastMonth = first.getMonth();
      const s = document.createElement('span'); s.style.left = (w*weekWidth())+'px'; s.textContent = MONTHS[lastMonth]; mo.appendChild(s);
    }
    for(let d=0; d<7; d++){
      const day = new Date(first); day.setDate(first.getDate()+d);
      const k = key(day), c = document.createElement('div'), x = day>today ? 0 : val(h,k);
      c.className = 'c'+(day>today?' future':'')+(x>0?' on':'')+(k===tk?' today':'');
      if(x>0){
        // INTENSITÉ : proportion de l'objectif atteinte (de 16 % à 100 % de la couleur pleine)
        const r = Math.min(1, x/h.goal);
        c.style.background = 'color-mix(in srgb, '+(h.color||'var(--l4)')+' '+Math.round(16+84*r)+'%, var(--l0))';
      }
      c.dataset.k = k; g.appendChild(c);
    }
  }
  // Toucher une case ouvre la fenêtre de ce jour (valider, ou saisir la quantité)
  g.addEventListener('click', e => {
    const k = e.target.dataset && e.target.dataset.k;
    if(!k || e.target.classList.contains('future')) return;
    openEntry(h, k);
  });
  return el;
}

/* ============================================================
   4. AFFICHAGE DE TOUTES LES HABITUDES
   ============================================================ */
let syncing = false;
function render(first){
  const old = document.querySelector('.scroll'), x = old ? old.scrollLeft : 0;   // on retient la position du défilement
  const box = $('#habits'); box.innerHTML = '';
  drawTabs();
  const cur = curPage();
  if(cur === 'matrix'){ drawMatrix(box); return; }
  if(cur === 'archive'){ drawArchive(box); return; }
  // if(cur === 'notes'){ drawNotes(box); return; }      // (désactivée)
  // if(cur === 'stats'){ drawStats(box); return; }      // (désactivée)                      // page Stats : dessin à part
  // Résumé de la semaine : seulement si activé dans les Paramètres, le lundi, et une seule fois par jour
  if(settings.summary && new Date().getDay()===1 && settings.sumSeen!==key(new Date())){ const w = weekCard(); if(w) box.appendChild(w); }
  const live = state.habits.filter(h => !h.archived);   // les habitudes en pause ne s'affichent pas
  const list = state.pages.length ? live.filter(h => pageOf(h) === cur) : live;            // seulement les habitudes de la page courante
  if(!list.length){ box.innerHTML = '<div class="empty">Aucune habitude sur cette page.<br>Touche « + » en bas pour en ajouter une.</div>'; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  // Début de la grille : le lundi d'il y a (nombre de semaines − 1) semaines
  const start = new Date(today); start.setDate(today.getDate() - ((today.getDay()+6)%7) - (settings.weeks-1)*7);
  list.forEach((h,i) => box.appendChild(block(h, i===0, today, start)));
  // Toutes les heatmaps défilent ensemble ; au premier affichage on va à la fin (aujourd'hui)
  const sc = [...document.querySelectorAll('.scroll')];
  sc.forEach(s => {
    s.scrollLeft = first ? 1e5 : x;
    s.addEventListener('scroll', () => {
      if(syncing) return; syncing = true;
      sc.forEach(o => { if(o!==s) o.scrollLeft = s.scrollLeft; });
      requestAnimationFrame(() => syncing = false);
    });
  });
}

/* ============================================================
   OUTILS (fmtTotal, mk) — le reste de cette partie est la page Stats (désactivée, voir plus bas)
   ============================================================ */
// const RANGES = [[7,'7 jours'],[30,'30 jours'],[90,'90 jours'],[-1,'Ce mois'],[365,'12 mois'],[0,'Tout']];   // (Stats désactivées)
// Total affiché : les minutes deviennent « 12 h 05 », le reste garde son unité
function fmtTotal(h, t){
  if(h.unit==='min'){ const m = Math.round(t); return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0'); }
  return fmt(t)+(h.unit?' '+h.unit:'');
}
// Petit outil pour créer un élément : mk('div', 'classe', 'texte')
function mk(tag, cls, text){ const e = document.createElement(tag); if(cls) e.className = cls; if(text!==undefined) e.textContent = text; return e; }
/* ===== PAGE STATS (désactivée pour l'instant) =====
   Tout le code des statistiques est conservé ici, en commentaire. Pour la réactiver :
   1) retire le commentaire de début (la ligne qui commence par barre-astérisque, juste ici),
      le commentaire s'arrête tout seul à la fin du titre de la section suivante ;
   2) remets l'onglet Stats dans drawTabs, la ligne drawStats dans render, la valeur 'stats' dans curPage ;
   3) remets la ligne RANGES un peu plus haut.

// Couleur d'une habitude dans les graphiques (si elle n'en a pas choisi, on prend une couleur de la palette)
const PAL = ['#8fbf9f','#7fa8d6','#e08a7a','#e0b265','#a994d6','#d98fb0','#6fc3c3','#c4c27a'];
const hcol = (h,i) => h.color || PAL[i % PAL.length];
// Chiffres d'une période [a, b] (textes "AAAA-MM-JJ") : jours actifs, habitudes faites, objectifs atteints, minutes
function periodStats(a, b){
  const e = [];
  state.habits.forEach(h => { const l = state.log[h.id]||{}; for(const k in l){ if(k>=a && k<=b && l[k]>0) e.push({h,k,v:l[k]}); } });
  return {act:new Set(e.map(x => x.k)).size, n:e.length, ok:e.filter(x => x.v>=x.h.goal).length, min:e.filter(x => x.h.unit==='min').reduce((s,x) => s+x.v, 0)};
}
// Une « carte » de chiffre clé
function card(label, value){ const c = mk('div','card'); c.append(mk('b','',value), mk('span','',label)); return c; }
// Un bloc de graphique : titre + dessin SVG + petite note
function chart(title, svg, note){
  const s = mk('section','ch'); s.appendChild(mk('h4','',title));
  const d = mk('div'); d.innerHTML = svg; s.appendChild(d);
  if(note) s.appendChild(mk('p','',note));
  return s;
}
// Camembert (anneau) : chaque part est un arc de cercle dessiné avec stroke-dasharray
function donut(items){
  const tot = items.reduce((s,x) => s+x.value, 0), C = 2*Math.PI*40;
  let off = 0, s = '<svg viewBox="0 0 100 100" class="donut">';
  items.forEach(x => {
    const len = x.value/tot*C;
    s += '<circle cx="50" cy="50" r="40" fill="none" stroke-width="16" transform="rotate(-90 50 50)" style="stroke:'+x.color+'" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off += len;
  });
  return s+'</svg>';
}
// Histogramme : vals = hauteurs, labels = étiquettes (ou null), hi = barre mise en avant
function bars(vals, labels, hi){
  const W = 300, H = labels ? 110 : 96, B = 80, n = vals.length, g = n>14 ? 2 : 8, bw = (W-g*(n-1))/n, max = Math.max(1,...vals);
  let s = '<svg viewBox="0 0 '+W+' '+H+'" class="bars">';
  vals.forEach((v,i) => {
    const h = v ? Math.max(3, v/max*B) : 1, x = (i*(bw+g)).toFixed(1);
    s += '<rect x="'+x+'" y="'+(B-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" style="fill:'+(v?'var(--l4)':'var(--edge)')+';opacity:'+(i===hi?1:.5)+'"/>';
    if(labels) s += '<text x="'+(+x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" style="fill:var(--dim);font-size:11px">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}

function drawStats(box){
  const today = new Date(); today.setHours(0,0,0,0);
  let days = settings.range;
  if(days<0) days = today.getDate();   // « Ce mois » : du 1er du mois à aujourd'hui
  if(!days){   // « Tout » : depuis la toute première saisie
    let first = today;
    state.habits.forEach(h => { for(const k in (state.log[h.id]||{})){ const d = new Date(k+'T00:00:00'); if(d<first) first = d; } });
    days = Math.max(1, Math.round((today-first)/864e5)+1);
  }
  const from = new Date(today); from.setDate(today.getDate()-days+1);
  const fk = key(from), tk = key(today);   // les textes "AAAA-MM-JJ" se comparent comme des dates
  // Choix de la période
  const seg = mk('div','seg');
  RANGES.forEach(([d,l]) => {
    const b = mk('button','btn'+(d===settings.range?' on':''), l);
    b.onclick = () => { settings.range = d; saveSettings(); render(); };
    seg.appendChild(b);
  });
  box.appendChild(seg);
  if(settings.range!==0){   // bouton de comparaison (absent pour « Tout » : il n'y a rien avant)
    const cb = mk('button','btn'+(settings.compare?' on':''), settings.range<0 ? 'Comparer avec le mois dernier' : 'Comparer avec la période précédente');
    cb.onclick = () => { settings.compare = !settings.compare; saveSettings(); render(); };
    box.appendChild(cb);
  }
  if(!state.habits.length){ box.appendChild(mk('div','empty','Rien à afficher pour l’instant.')); return; }

  // Les données de la période : une entrée = une habitude un jour donné (avec une valeur > 0)
  const ent = [];
  state.habits.forEach((h,i) => { const l = state.log[h.id]||{}; for(const k in l){ if(k>=fk && k<=tk && l[k]>0) ent.push({h,i,k,v:l[k]}); } });
  const reached = ent.filter(e => e.v>=e.h.goal).length;
  const mins = ent.filter(e => e.h.unit==='min').reduce((s,e) => s+e.v, 0);

  // 1. Chiffres clés
  const cards = mk('div','cards');
  cards.append(card('jours actifs', new Set(ent.map(e => e.k)).size+' / '+days), card('habitudes faites', String(ent.length)),
    card('objectifs atteints', ent.length ? Math.round(reached/ent.length*100)+' %' : '–'));
  if(mins>0) cards.appendChild(card('temps total', fmtTotal({unit:'min'}, mins)));
  box.appendChild(cards);

  // 1b. Comparaison avec la période d'avant : des chiffres neutres, juste une différence (+ ou −), sans jugement
  if(settings.compare && settings.range!==0){
    let pf = new Date(from); pf.setDate(from.getDate()-days);                          // période juste avant, même durée
    if(settings.range<0) pf = new Date(today.getFullYear(), today.getMonth()-1, 1);    // « Ce mois » : on compare au début du mois dernier
    const pt = new Date(pf); pt.setDate(pf.getDate()+days-1);
    const cur = periodStats(fk, tk), prev = periodStats(key(pf), key(pt));
    const cmp = mk('section','ch');
    cmp.append(mk('h4','','Comparaison'), mk('p','',(settings.range<0 ? 'Ce mois-ci contre le mois dernier' : 'Cette période contre la précédente')+', sur le même nombre de jours.'));
    const lines = [['jours actifs', cur.act, prev.act, String], ['habitudes faites', cur.n, prev.n, String], ['objectifs atteints', cur.ok, prev.ok, String]];
    if(cur.min || prev.min) lines.push(['temps', cur.min, prev.min, m => fmtTotal({unit:'min'}, m)]);
    lines.forEach(([lab, a, b, f]) => {
      const mx = Math.max(a, b, 1), r = mk('div','cmp'), hd = mk('div','sth');
      hd.append(mk('b','',lab), mk('span','', a===b ? '=' : (a>b ? '+' : '−')+f(Math.abs(a-b))));
      r.appendChild(hd);
      [['Avant', b, .45], ['Actuel', a, 1]].forEach(([t, v, op]) => {
        const tr = mk('div','stbar'), i = mk('i');
        i.style.width = Math.round(v/mx*100)+'%'; i.style.background = 'var(--l4)'; i.style.opacity = op; tr.appendChild(i);
        const w = mk('div','cb'); w.append(mk('span','',t), tr, mk('span','',f(v))); r.appendChild(w);
      });
      cmp.appendChild(r);
    });
    box.appendChild(cmp);
  }

  // 2. Camemberts (temps par habitude, puis répartition des jours actifs)
  const byH = state.habits.map((h,i) => {
    const e = ent.filter(x => x.h===h);
    return {h, col:hcol(h,i), n:e.length, ok:e.filter(x => x.v>=h.goal).length, t:e.reduce((s,x) => s+x.v, 0)};
  });
  const pie = (title, items) => {
    items = items.filter(x => x.value>0);
    if(!items.length) return;
    const wrap = mk('div','dn'), sv = mk('div'), lg = mk('div','lg');
    sv.innerHTML = donut(items);
    items.forEach(x => {
      const r = mk('div'), d = mk('i'); d.style.background = x.color;
      r.append(d, document.createTextNode(x.label), mk('em','',x.text)); lg.appendChild(r);
    });
    wrap.append(sv.firstChild, lg);
    const s = mk('section','ch'); s.append(mk('h4','',title), wrap); box.appendChild(s);
  };
  pie('Temps par habitude', byH.filter(x => x.h.unit==='min').map(x => ({label:x.h.name, value:x.t, color:x.col, text:fmtTotal(x.h,x.t)})));
  pie('Répartition des jours actifs', byH.map(x => ({label:x.h.name, value:x.n, color:x.col, text:x.n+' j'})));

  if(ent.length){
    // 3. Par jour de la semaine (lundi en premier)
    const wd = [0,0,0,0,0,0,0];
    ent.forEach(e => { wd[(new Date(e.k+'T00:00:00').getDay()+6)%7]++; });
    const best = wd.indexOf(Math.max(...wd));
    box.appendChild(chart('Par jour de la semaine', bars(wd, WEEK, best), 'Jour le plus actif : '+['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'][best]));
    // 4. Dans le temps : la période est coupée en 30 tranches au maximum
    const size = Math.max(1, Math.ceil(days/30)), nb = Math.ceil(days/size), bk = new Array(nb).fill(0);
    ent.forEach(e => { const i = Math.floor(Math.round((new Date(e.k+'T00:00:00')-from)/864e5)/size); if(i>=0 && i<nb) bk[i]++; });
    box.appendChild(chart('Activité dans le temps', bars(bk, null, bk.indexOf(Math.max(...bk))),
      (size===1 ? 'Par jour' : 'Par tranche de '+size+' jours')+' · depuis le '+from.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})));
  }

  // 5. Détail par habitude (groupé par page s'il y en a)
  const groups = state.pages.length ? state.pages.map(p => [p.name, byH.filter(x => pageOf(x.h)===p.id)]) : [['Détail', byH]];
  groups.forEach(([name, part]) => {
    if(!part.length) return;
    box.appendChild(mk('div','sgrp',name));
    part.forEach(x => {
      const h = x.h, binary = h.goal<=1 && !h.unit;   // case à cocher : on compte les fois, pas un total
      const e = mk('div','st'), hd = mk('div','sth');
      hd.append(mk('b','',h.name), mk('span','', binary ? x.n+' fois' : fmtTotal(h,x.t)));
      const bar = mk('div','stbar'), fill = mk('i');   // barre : part des jours actifs sur la période
      fill.style.width = Math.round(x.n/days*100)+'%'; fill.style.background = x.col;
      bar.appendChild(fill);
      e.append(hd, bar, mk('div','sts', binary ? 'sur '+days+' jours' : x.n+' jours actifs sur '+days+' · objectif atteint '+x.ok+' fois'+(x.n ? ' · moy. '+fmtTotal(h,x.t/x.n)+' par jour actif' : '')));
      box.appendChild(e);
    });
  });
}

// ===== Archive et résumé de la semaine (actifs) =====
// Page Archive : les habitudes en pause (historique conservé). On peut les réactiver ou les supprimer.
function drawArchive(box){
  const list = state.habits.filter(h => h.archived);
  if(!list.length){ box.appendChild(mk('div','empty','Aucune habitude en pause.')); return; }
  box.appendChild(mk('p','hint','Les habitudes en pause n’apparaissent plus sur les pages, mais leur historique est conservé (et compté dans les stats).'));
  list.forEach(h => {
    const n = Object.keys(state.log[h.id]||{}).length, row = mk('div','arow'), t = mk('div','at');
    t.append(mk('b','',h.name), mk('span','',n+' jour'+(n>1?'s':'')+' enregistré'+(n>1?'s':'')));
    const re = mk('button','btn','Réactiver'), del = mk('button','btn','Supprimer');
    re.onclick = () => { delete h.archived; save(); render(); };
    del.onclick = () => {
      if(!confirm('Supprimer « '+h.name+' » et tout son historique ?')) return;
      state.habits = state.habits.filter(x => x.id!==h.id); delete state.log[h.id]; if(state.notes) delete state.notes[h.id];
      save(); render();
    };
    row.append(t, re, del); box.appendChild(row);
  });
}

// Résumé de la semaine passée (lundi → dimanche), affiché en haut le lundi si l'option est activée
function weekCard(){
  const today = new Date(); today.setHours(0,0,0,0);
  const to = new Date(today); to.setDate(today.getDate()-1);
  const from = new Date(today); from.setDate(today.getDate()-7);
  const fk = key(from), tk = key(to);
  let n = 0, mins = 0, best = null; const days = new Set();
  state.habits.filter(h => !h.archived).forEach(h => {
    let c = 0; const l = state.log[h.id] || {};
    for(const k in l){ if(k>=fk && k<=tk && l[k]>0){ n++; c++; days.add(k); if(h.unit==='min') mins += l[k]; } }
    if(c && (!best || c>best.c)) best = {h,c};
  });
  if(!n) return null;   // rien à résumer : on n'affiche rien
  const c = mk('section','wk');
  c.appendChild(mk('h4','','Semaine dernière'));
  const s = d => d>1 ? 's' : '';
  const lines = [days.size+' jour'+s(days.size)+' actif'+s(days.size)+' sur 7', n+' habitude'+s(n)+' faite'+s(n)];
  if(mins>0) lines.push(fmtTotal({unit:'min'}, mins)+' de temps enregistré');
  if(best) lines.push('Le plus régulier : '+best.h.name+' ('+best.c+' j)');
  lines.forEach(t => c.appendChild(mk('p','',t)));
  const x = mk('button','btn','Fermer');
  x.onclick = () => { settings.sumSeen = key(today); saveSettings(); render(); };
  c.appendChild(x);
  return c;
}

/* ============================================================
   MATRICE D'EISENHOWER : les tâches sont rangées selon urgent / important
   (haut gauche : urgent + important ; haut droite : important ; bas gauche : urgent ; bas droite : ni l'un ni l'autre)
   ============================================================ */
function drawMatrix(box){
  const grid = mk('div','mx');
  state.blocks.forEach(bk => {
    const card = mk('section','qd'), hd = mk('div','qh');
    const nm = mk('button','qn',bk.name); nm.onclick = () => openBlock(bk);   // toucher le titre : renommer / déplacer / supprimer
    hd.appendChild(nm);
    card.appendChild(hd);
    // Une ligne de tâche : rond pour terminer, texte pour modifier / déplacer / supprimer
    const makeRow = t => {
      const w = mk('div','tw'+(t.done?' done':'')), r = mk('div','tk'+(t.done?' done':'')), c = mk('button','ck'), tt = mk('button','tt',t.text);
      c.setAttribute('aria-label','Terminer');
      c.onclick = () => { t.done = !t.done; save(); render(); };
      tt.onclick = () => openTask(t);
      r.append(c, tt);
      const subs = t.subs || [];
      if(subs.length){
        // Pliage : la flèche affiche ou cache les sous-tâches ; le compteur donne l'avancement (ex. 1/3)
        const fold = mk('button','fold'+(t.fold ? ' shut' : ''));
        fold.setAttribute('aria-label','Plier ou déplier les sous-tâches');
        fold.append(mk('span','',subs.filter(s => s.done).length+'/'+subs.length), mk('i'));
        fold.onclick = () => { t.fold = !t.fold; save(); render(); };
        r.appendChild(fold);
      }
      w.appendChild(r);
      if(subs.length && !t.fold){   // sous-tâches visibles seulement si la tâche n'est pas repliée
        const sl = mk('div','subs');
        subs.forEach(s => {
          const sr = mk('div','sk'+(s.done?' done':'')), sc = mk('button','ck'), st = mk('button','tt',s.text);
          sc.setAttribute('aria-label','Terminer la sous-tâche');
          sc.onclick = () => { s.done = !s.done; save(); render(); };
          st.onclick = () => openTask(t);   // toucher une sous-tâche ouvre la tâche pour la modifier
          sr.append(sc, st); sl.appendChild(sr);
        });
        w.appendChild(sl);
      }
      return w;
    };
    const mine = state.tasks.filter(t => t.b===bk.id);
    mine.filter(t => !t.done).concat(mine.filter(t => t.done)).forEach(t => card.appendChild(makeRow(t)));   // les terminées en bas
    // Champ d'ajout : on tape, on valide avec Entrée (le clavier reste ouvert pour en ajouter d'autres)
    const f = document.createElement('form'), inp = document.createElement('input'), pb = mk('button','plus','+');
    pb.type = 'button'; pb.onclick = () => { add(); inp.focus(); }; pb.setAttribute('aria-label','Ajouter');
    inp.className = 'tadd'; inp.placeholder = 'Ajouter'; inp.maxLength = 80; inp.autocomplete = 'off'; inp.enterKeyHint = 'done';
    f.append(pb, inp);
    const add = () => {
      const v = inp.value.trim(); if(!v) return;
      inp.value = '';   // vidé tout de suite : évite un double ajout
      const t = {id:'t'+Date.now()+Math.random().toString(36).slice(2,5), text:v, b:bk.id, done:false};
      state.tasks.push(t); save();
      card.insertBefore(makeRow(t), card.querySelector('.tw.done') || f);   // ajout sans tout redessiner
    };
    f.onsubmit = e => { e.preventDefault(); add(); };
    pb.onpointerdown = e => e.preventDefault();   // garde le clavier ouvert : le tap sur « + » n'est plus perdu quand l'écran bouge
    inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); add(); } };   // Entrée ajoute aussi
    inp.onblur = add;                              // si on quitte le champ avec du texte, il est ajouté
    card.appendChild(f); grid.appendChild(card);
  });
  if(!state.blocks.length) box.appendChild(mk('div','empty','Aucun bloc de tâches.<br>Crée-en un pour commencer.'));
  box.appendChild(grid);
  const nb = mk('div','mxf'), nbb = mk('button','btn','+ Nouveau bloc');
  nbb.onclick = () => openBlock(null); nb.appendChild(nbb); box.appendChild(nb);
  const nd = state.tasks.filter(t => t.done).length;
  if(nd){
    const b = mk('button','btn','Effacer les terminées ('+nd+')'), w = mk('div','mxf');
    b.onclick = () => { if(!confirm('Effacer les '+nd+' tâche'+(nd>1?'s':'')+' terminée'+(nd>1?'s':'')+' ?')) return; state.tasks = state.tasks.filter(t => !t.done); save(); render(); };
    w.appendChild(b); box.appendChild(w);
  }
}
// Fenêtre d'un bloc : créer (bk = null), renommer, déplacer, supprimer
function openBlock(bk){
  sheet('<h3>'+(bk ? 'Bloc' : 'Nouveau bloc')+'</h3><input id="bn" maxlength="40" placeholder="Nom du bloc">'+
    '<div class="acts"><button class="btn main" id="ok">'+(bk ? 'Enregistrer' : 'Créer')+'</button><button class="btn" id="no">Annuler</button>'+
    (bk ? '<button class="btn" id="up">↑</button><button class="btn" id="dn">↓</button><button class="btn del" id="rm">Supprimer</button>' : '')+'</div>');
  const inp = $('#bn'); inp.value = bk ? bk.name : ''; inp.focus();
  const ok = () => {
    const v = inp.value.trim(); if(!v) return;
    if(bk) bk.name = v; else state.blocks.push({id:'b'+Date.now(), name:v});
    save(); close(); render();
  };
  inp.onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); ok(); } };
  $('#ok').onclick = ok; $('#no').onclick = close;
  if(bk){
    const mv = d => { const i = state.blocks.indexOf(bk), j = i+d; if(j<0 || j>=state.blocks.length) return; [state.blocks[i],state.blocks[j]] = [state.blocks[j],state.blocks[i]]; save(); close(); render(); };
    $('#up').onclick = () => mv(-1); $('#dn').onclick = () => mv(1);
    $('#rm').onclick = () => {
      const n = state.tasks.filter(t => t.b===bk.id).length;
      if(!confirm('Supprimer le bloc « '+bk.name+' »'+(n ? ' et ses '+n+' tâche'+(n>1?'s':'') : '')+' ?')) return;
      state.blocks = state.blocks.filter(x => x!==bk); state.tasks = state.tasks.filter(t => t.b!==bk.id); save(); close(); render();
    };
  }
}
// Fenêtre d'une tâche : modifier le texte, la changer de bloc, ou la supprimer
function openTask(t){
  sheet('<h3>Tâche</h3><input id="tn" maxlength="80"><div style="margin-top:14px"><label>Bloc</label><div class="seg" id="tq" style="margin-bottom:0"></div></div>'+
    '<div style="margin-top:16px"><label>Sous-tâches</label><div id="sl"></div><div class="addsub"><input id="sn" maxlength="80" placeholder="Ajouter une sous-tâche"><button class="btn" id="sa" type="button">+</button></div></div>'+
    '<div class="acts"><button class="btn main" id="ok">Enregistrer</button><button class="btn" id="no">Annuler</button><button class="btn del" id="rm">Supprimer</button></div>');
  $('#tn').value = t.text;
  let q = Math.max(0, state.blocks.findIndex(x => x.id===t.b));
  const tq = $('#tq'), show = () => [...tq.children].forEach((b,i) => b.className = 'btn'+(i===q?' on':''));
  state.blocks.forEach((d,i) => { const b = mk('button','btn',d.name); b.onclick = () => { q = i; show(); }; tq.appendChild(b); });
  show();
  // Sous-tâches : on coche, on renomme, on supprime, on ajoute. On travaille sur une copie : rien n'est gardé sans « Enregistrer ».
  const subs = (t.subs || []).map(s => ({...s}));
  const sl = $('#sl');
  const drawSubs = () => {
    sl.innerHTML = '';
    subs.forEach((s,i) => {
      const row = mk('div','srow'), ck = mk('button','ck'+(s.done?' on':'')), inp = document.createElement('input'), x = mk('button','btn','×');
      ck.onclick = () => { s.done = !s.done; ck.className = 'ck'+(s.done?' on':''); };
      inp.value = s.text; inp.maxLength = 80; inp.oninput = () => { s.text = inp.value; };
      x.onclick = () => { subs.splice(i,1); drawSubs(); };
      row.append(ck, inp, x); sl.appendChild(row);
    });
  };
  const addSub = () => {
    const v = $('#sn').value.trim(); if(!v) return;
    subs.push({id:'s'+Date.now()+subs.length, text:v, done:false});
    $('#sn').value = ''; drawSubs(); $('#sn').focus();
  };
  $('#sa').onclick = addSub;
  $('#sn').onkeydown = e => { if(e.key==='Enter'){ e.preventDefault(); addSub(); } };
  drawSubs();
  $('#no').onclick = close;
  $('#ok').onclick = () => {
    const v = $('#tn').value.trim(); if(!v) return;
    const pend = $('#sn').value.trim();
    if(pend) subs.push({id:'s'+Date.now(), text:pend, done:false});   // texte tapé dans le champ mais pas encore ajouté
    t.text = v; t.b = state.blocks[q].id;
    t.subs = subs.map(s => ({id:s.id, text:s.text.trim(), done:!!s.done})).filter(s => s.text);
    if(!t.subs.length) delete t.subs;
    save(); close(); render();
  };
  $('#rm').onclick = () => { state.tasks = state.tasks.filter(x => x.id!==t.id); save(); close(); render(); };
}

// Fenêtre d'un jour : on y voit la date précise, puis on valide ou on saisit la quantité.
// Chaque appui est enregistré tout de suite ; « OK » ferme simplement la fenêtre.
function openEntry(h, k){
  const date = new Date(k+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const toggle = h.goal <= 1;   // objectif de 1 → fait / pas fait ; sinon une quantité
  sheet('<h3></h3><div class="entry">'+(toggle
      ? '<button class="btn" id="tg"></button>'
      : '<button class="sq" id="mi" aria-label="Moins">−</button><div class="big" id="bv"></div><button class="sq" id="pl" aria-label="Plus">+</button>')+
    '</div><div class="tmr" id="tmr"></div>'+
    // Note du jour (désactivée) : '<details class="note"><summary id="ns">Note</summary><textarea id="nt" placeholder="Une note pour ce jour…"></textarea></details>'+
    '<div class="acts"><button class="btn main" id="no">OK</button>'+(toggle?'':'<button class="btn" id="zr">Remettre à 0</button>')+'</div>');
  $('#sheet h3').textContent = h.name+' · '+date;
  // show() met à jour ce qui est affiché dans la fenêtre
  const show = () => {
    if(toggle){
      const on = val(h,k) >= h.goal;
      $('#tg').textContent = on ? '✓ Fait' : 'Pas fait';
      $('#tg').className = 'btn tg'+(on?' on':'');
    }else{
      $('#bv').textContent = fmt(val(h,k))+' / '+fmt(h.goal)+(h.unit?' '+h.unit:'');
    }
  };
  if(toggle){
    $('#tg').onclick = () => { setVal(h,k, val(h,k)>=h.goal ? 0 : h.goal); show(); };
  }else{
    const add = d => { setVal(h,k,val(h,k)+d); show(); };
    $('#mi').onclick = () => add(-h.step);
    $('#pl').onclick = () => add(h.step);
    $('#zr').onclick = () => { setVal(h,k,0); show(); };
  }
  $('#no').onclick = close;
  show();
  // Minuteur : seulement pour les habitudes en minutes, et seulement pour aujourd'hui
  if(h.unit==='min' && k===key(new Date())){
    let last = '';   // message affiché après un arrêt du minuteur
    const run = () => {
      const t = timers[h.id], tmr = $('#tmr');
      tmr.innerHTML = '';
      const b = mk('button','btn tg'+(t?' on tms':''), t ? '■ Arrêter · '+clock(Date.now()-t.start) : '▶ Démarrer le minuteur');
      b.dataset.id = h.id;
      b.onclick = () => {
        if(t){
          const r = stopTimer(h);   // on arrête : r = durée de la session
          last = r && r.m>0 ? 'Session terminée : '+dur(r.ms)+' · +'+r.m+' min ajoutées à la journée' : 'Session trop courte (moins de 30 s) : rien d’ajouté';
          show();
        }else{ last = ''; startTimer(h); }
        run();
      };
      tmr.appendChild(b);
      if(last && !t){ const p = mk('p','hint',last); p.style.margin = '12px 0 0'; tmr.appendChild(p); }   // résultat de la dernière session
    };
    run();
  }
  // NOTE DU JOUR (désactivée pour l'instant : pour la réactiver, enlève les « // » des lignes ci-dessous
  // et celui de la ligne « Note du jour » dans le texte de la fenêtre, plus haut) : enregistrée à chaque frappe
  // const nt = $('#nt'), ns = $('#ns');
  // nt.value = getNote(h,k);
  // const mark = () => { ns.textContent = nt.value.trim() ? 'Note ·' : 'Note'; };   // le « · » indique qu'une note existe
  // nt.oninput = () => { setNote(h,k,nt.value); mark(); };
  // mark();
}

function openHabit(h){
  const n = !h;   // vrai = on crée une nouvelle habitude
  sheet('<h3>'+(n?'Nouvelle habitude':'Modifier l’habitude')+'</h3>'+
    '<div class="f"><div><label>Nom</label><input id="fn"></div>'+
    '<div><label>Objectif</label><input id="fg" inputmode="decimal"></div>'+
    '<div><label>Unité</label><input id="fu" placeholder="L, pages, min…"></div>'+
    '<div><label>Pas du + / −</label><input id="fs" inputmode="decimal"></div></div>'+
    '<div id="pgw"></div>'+
    '<div style="margin-top:16px"><label>Couleur</label><div class="sw" id="sw"><label class="pickbox" id="cpb" title="Choisir n’importe quelle couleur"><input type="color" id="cp" value="#8fbf9f"></label></div></div>'+
    '<div class="acts"><button class="btn main" id="ok">Enregistrer</button><button class="btn" id="no">Annuler</button>'+
    (n?'':'<button class="btn" id="up" aria-label="Monter">↑</button><button class="btn" id="dn" aria-label="Descendre">↓</button><button class="btn" id="ar">Mettre en pause</button><button class="btn del" id="rm">Supprimer</button>')+'</div>');
  $('#fn').value = n?'':h.name; $('#fg').value = n?'1':fmt(h.goal); $('#fu').value = n?'':h.unit; $('#fs').value = n?'1':fmt(h.step);
  // Choix de la couleur : la première pastille (couleur du thème) est le choix par défaut
  let color = n ? '' : (h.color||'');
  const sw = $('#sw');
  // Choix de la page de l'habitude (seulement s'il existe des pages)
  let page = n ? curPage() : pageOf(h);
  if(state.pages.length){
    const pgw = $('#pgw'), pg = mk('div','seg');
    pgw.style.marginTop = '14px'; pg.style.marginBottom = '0';
    pgw.appendChild(mk('label','','Page'));
    const showPage = () => [...pg.children].forEach(b => b.className = 'btn'+(b.dataset.p===page?' on':''));
    state.pages.forEach(p => {
      const b = mk('button','btn',p.name); b.dataset.p = p.id;
      b.onclick = () => { page = p.id; showPage(); };
      pg.appendChild(b);
    });
    pgw.appendChild(pg); showPage();
  }
  // Couleur : pastilles prêtes à l'emploi + la pastille « spectre » pour choisir n'importe quelle couleur
  const pick = $('#cp'), pickBox = $('#cpb');
  const PRESETS = ['', '#8fbf9f', '#7fa8d6', '#e08a7a', '#e0b265', '#a994d6', '#d98fb0'];
  const marks = () => {   // met en évidence le choix courant
    [...sw.querySelectorAll('button')].forEach(b => b.className = (b.dataset.c||'')===color ? 'on' : '');
    pickBox.className = 'pickbox'+(color && !PRESETS.includes(color) ? ' on' : '');
  };
  PRESETS.forEach(c => {
    const b = document.createElement('button');
    b.dataset.c = c; b.style.background = c || 'var(--l4)'; b.setAttribute('aria-label','Couleur');
    b.onclick = () => { color = c; marks(); };
    sw.insertBefore(b, pickBox);
  });
  if(color && !PRESETS.includes(color)){ pick.value = color; pickBox.style.background = color; }   // couleur personnalisée déjà choisie
  pick.oninput = () => { color = pick.value; pickBox.style.background = color; marks(); };
  marks();
  $('#no').onclick = close;
  $('#ok').onclick = () => {
    const name = $('#fn').value.trim(); if(!name){ $('#fn').focus(); return; }
    const o = {name, goal:num($('#fg').value,1), unit:$('#fu').value.trim(), step:num($('#fs').value,1), color, page};
    if(n) state.habits.push({id:'h'+Date.now(), ...o}); else Object.assign(h,o);
    settings.page = page; saveSettings();   // on affiche la page de l'habitude
    save(); close(); render(true);
  };
  if(!n){
    // Monter / descendre l'habitude dans la liste
    const move = d => {
      const i = state.habits.indexOf(h);
      let j = i+d;
      while(j>=0 && j<state.habits.length && state.habits[j].page!==h.page) j += d;   // saute les habitudes des autres pages
      if(j<0 || j>=state.habits.length) return;
      [state.habits[i], state.habits[j]] = [state.habits[j], state.habits[i]];
      save(); render();
    };
    $('#up').onclick = () => move(-1); $('#dn').onclick = () => move(1);
    // Pause : l'habitude disparaît des pages mais son historique reste (onglet Archive pour la réactiver)
    $('#ar').onclick = () => { h.archived = true; save(); close(); render(); };
    $('#rm').onclick = () => {
      if(!confirm('Supprimer « '+h.name+' » et tout son historique ?')) return;
      state.habits = state.habits.filter(x => x.id!==h.id); delete state.log[h.id]; if(state.notes) delete state.notes[h.id];
      save(); close(); render();
    };
  }
  if(n) $('#fn').focus();
}

// Fenêtre des paramètres : sauvegarde (fichier), données visibles en JSON, et remise à zéro
function openData(){
  sheet('<h3>Paramètres</h3>'+
    '<div class="sec"><h4>Affichage</h4><p>Ces réglages sont propres à cet appareil.</p>'+
    '<label>Thème</label><div class="seg" id="th"></div>'+
    '<label>Fond d’écran (thèmes Glace)</label><div class="seg"><button class="btn" id="wpb">Choisir une photo</button><button class="btn" id="wpr">Retirer</button></div><input type="file" id="wpf" accept="image/*" hidden>'+

    '<label>Période affichée</label><div class="seg"><button class="btn" id="w26">6 mois</button><button class="btn" id="w53">12 mois</button></div>'+
    '<div class="zr"><input type="range" id="zm" min="40" max="300" step="5"><span id="zv"></span></div>'+

    '<div class="sec"><h4>Sauvegarde</h4><p>Exporte un fichier .json pour garder tes données, ou importe-en un pour les restaurer (par exemple sur un autre appareil). L’import remplace les données actuelles.</p>'+
    '<div class="acts"><button class="btn main" id="ex">Exporter un fichier</button><button class="btn" id="im">Importer un fichier</button><button class="btn" id="csv">Exporter en CSV</button></div></div>'+
    '<div class="sec"><h4>Données (JSON)</h4><p>Voici le contenu exact de tes données. Tu peux le copier, ou coller ici un texte sauvegardé puis l’importer.</p>'+
    '<textarea id="dt" spellcheck="false"></textarea>'+
    '<div class="acts" style="margin-top:10px"><button class="btn" id="cp">Copier</button><button class="btn" id="imt">Importer ce texte</button></div></div>'+
    '<div id="msg"></div>'+
    '<div class="sec"><h4>Zone sensible</h4><div class="acts"><button class="btn" id="cl">Tout effacer</button></div></div>'+
    '<div class="acts"><button class="btn main" id="no">Fermer</button></div>');
  $('#dt').value = JSON.stringify(state, null, 2);   // null, 2 = texte indenté, lisible
  // Affichage : période (26 ou 53 semaines) et zoom (curseur). Chaque changement est appliqué tout de suite.
  const zm = $('#zm'), zv = $('#zv');
  const sync = () => {
    zm.value = settings.zoom; zv.textContent = settings.zoom+' %';
    $('#w26').className = 'btn'+(settings.weeks===26?' on':'');
    $('#w53').className = 'btn'+(settings.weeks===53?' on':'');
  };
  const apply = () => { applyZoom(); saveSettings(); sync(); render(true); };
  $('#w26').onclick = () => { settings.weeks = 26; apply(); };
  $('#w53').onclick = () => { settings.weeks = 53; apply(); };
  zm.oninput = () => { settings.zoom = +zm.value; apply(); };
  // « Ajuster à l'écran » : calcule le zoom pour que toute la période tienne dans la largeur (17 px = case + espace à 100 %)
  $('#fit').onclick = () => {
    const sc = document.querySelector('.scroll');
    const avail = (sc ? sc.clientWidth : $('#habits').clientWidth - 24) - 6;
    settings.zoom = Math.max(40, Math.min(300, Math.floor(avail/(settings.weeks*17)*100)));
    apply();
  };
  sync();
  // Thème : Auto (suit le téléphone), Nuit, Papier, Sépia — appliqué tout de suite
  const th = $('#th');
  [['glace','Glace nuit'],['glaceclair','Glace clair'],['auto','Auto'],['nuit','Nuit'],['papier','Papier'],['sepia','Sépia']].forEach(([id,l]) => {
    const b = mk('button','btn'+(settings.theme===id?' on':''), l);
    b.onclick = () => { settings.theme = id; applyTheme(); saveSettings(); [...th.children].forEach(x => x.className = 'btn'); b.className = 'btn on'; };
    th.appendChild(b);
  });
  // Fond d'écran : photo choisie dans la galerie, floutée derrière le verre des cartes
  const wf = $('#wpf'), wb = $('#wpb');
  const wpLabel = () => { wb.textContent = wallpaper ? 'Changer la photo' : 'Choisir une photo'; $('#wpr').hidden = !wallpaper; };
  wb.onclick = () => wf.click();
  wf.onchange = () => { const f = wf.files[0]; if(!f) return;
    if(!settings.theme.startsWith('glace')){ settings.theme = 'glace'; applyTheme(); saveSettings(); [...$('#th').children].forEach((x,i) => x.className = 'btn'+(i===0?' on':'')); }   // la photo ne se voit que dans un thème Glace
    wb.textContent = '…'; loadWallpaper(f, r => { if(r==='err') alert('Cette image ne peut pas être lue. Essaie une photo en JPEG ou PNG.'); else if(r==='nostore') alert('Le fond est appliqué, mais le navigateur ne peut pas le garder : il disparaîtra à la fermeture.'); wf.value = ''; wpLabel(); }); };
  $('#wpr').onclick = () => { wallpaper = ''; try{ localStorage.removeItem(WKEY); }catch(e){} applyWallpaper(); wpLabel(); };
  wpLabel();
  // Résumé de la semaine : désactivé par défaut (si tu l'actives un lundi, il s'affiche tout de suite)
  const sm = $('#sm');
  [[false,'Non'],[true,'Oui']].forEach(([v,l]) => {
    const b = mk('button','btn'+(settings.summary===v?' on':''), l);
    b.onclick = () => { settings.summary = v; settings.sumSeen = ''; saveSettings(); [...sm.children].forEach(x => x.className = 'btn'); b.className = 'btn on'; render(); };
    sm.appendChild(b);
  });
  // Pages : liste modifiable (renommer, monter, descendre, supprimer) + ajout
  const pl = $('#pl');
  const drawPages = () => {
    pl.innerHTML = '';
    if(!state.pages.length) pl.appendChild(mk('p','','Aucune page pour l’instant.'));
    state.pages.forEach((p,i) => {
      const row = mk('div','prow'), inp = document.createElement('input');
      inp.value = p.name; inp.maxLength = 24;
      inp.onchange = () => { p.name = inp.value.trim() || p.name; save(); render(); };
      const mv = (d,t) => {
        const b = mk('button','btn',t);
        b.onclick = () => { const j = i+d; if(j<0 || j>=state.pages.length) return; [state.pages[i],state.pages[j]] = [state.pages[j],state.pages[i]]; save(); render(); drawPages(); };
        return b;
      };
      const del = mk('button','btn','×');
      del.onclick = () => {
        if(!confirm('Supprimer la page « '+p.name+' » ? Ses habitudes passent sur la première page.')) return;
        state.pages.splice(i,1); save(); render(); drawPages();
      };
      row.append(inp, mv(-1,'↑'), mv(1,'↓'), del); pl.appendChild(row);
    });
    $('#dt').value = JSON.stringify(state, null, 2);   // met à jour le texte JSON affiché plus bas
  };
  $('#pa').onclick = () => {
    const v = $('#pn').value.trim(); if(!v) return;
    state.pages.push({id:'p'+Date.now(), name:v}); $('#pn').value = ''; save(); render(); drawPages();
  };
  drawPages();
  $('#no').onclick = close;
  $('#ex').onclick = exportData;
  $('#csv').onclick = exportCSV;
  $('#im').onclick = () => $('#file').click();      // ouvre le choix de fichier
  $('#imt').onclick = () => applyImport($('#dt').value);
  $('#cp').onclick = () => {
    const t = $('#dt'); t.select(); let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    $('#msg').textContent = ok ? 'Texte copié.' : 'Texte sélectionné : copie-le à la main.';
  };
  $('#cl').onclick = () => {
    if(!confirm('Tout effacer, habitudes et historique ?')) return;
    state = {habits:[], log:{}, pages:[], notes:{}, tasks:[], blocks:[]}; save(); close(); render(true);
  };
}

// Export : crée un fichier .json et le télécharge
function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'tracker-'+key(new Date())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('#msg').textContent = 'Fichier exporté.';
  }catch(e){ $('#msg').textContent = 'Export impossible ici : copie plutôt le texte ci-dessous.'; }
}
// Export CSV : une ligne par habitude et par jour (valeur et/ou note), pour ouvrir dans un tableur.
// Séparateur « ; » et virgule décimale (réglage français d'Excel) ; le \ufeff au début aide Excel à lire les accents.
function exportCSV(){
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';   // entoure de guillemets pour que le texte ne casse pas les colonnes
  const rows = [['page','habitude','unité','objectif','date','valeur','note','en pause'].map(q).join(';')];
  state.habits.forEach(h => {
    const l = state.log[h.id] || {}, n = (state.notes||{})[h.id] || {};
    const pg = (state.pages.find(p => p.id===pageOf(h)) || {}).name || '';
    Object.keys(Object.assign({}, l, n)).sort().forEach(k => {
      rows.push([pg, h.name, h.unit, fmt(h.goal), k, fmt(l[k]||0), n[k]||'', h.archived ? 'oui' : ''].map(q).join(';'));
    });
  });
  try{
    const blob = new Blob(['\ufeff'+rows.join('\r\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'tracker-'+key(new Date())+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    $('#msg').textContent = 'Fichier CSV exporté.';
  }catch(e){ $('#msg').textContent = 'Export impossible ici.'; }
}
// Import : remplace les données actuelles par celles du texte (après confirmation)
function applyImport(text){
  try{
    const o = clean(JSON.parse(text)); if(!o) throw 0;
    if(!confirm('Remplacer les données actuelles ?')) return;
    state = o; save(); close(); render(true);
  }catch(e){ $('#msg').textContent = 'Fichier ou texte invalide.'; }
}
// Quand un fichier est choisi, on le lit puis on l'importe
$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader(); r.onload = () => applyImport(r.result); r.readAsText(f);
  e.target.value = '';
});

/* ============================================================
   6. DÉMARRAGE
   ============================================================ */
$('#new').onclick = () => openHabit(null);
// Toucher un onglet change de page
$('#tabs').addEventListener('click', e => { const p = e.target.dataset && e.target.dataset.p; if(p!==undefined) setPage(p); });
$('#dat').onclick = openData;
$('#ov').addEventListener('click', e => { if(e.target.id==='ov') close(); });   // toucher le fond ferme la fenêtre
document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });
render(true);
</script>
